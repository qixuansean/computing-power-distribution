[package]
name = "ocn-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"
ring = "0.17"
hex = "0.4"
bincode = "1.3"
jni = { version = "0.21", optional = true }

[features]
default = []
android-jni = ["dep:jni"]
