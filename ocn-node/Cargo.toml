[package]
name = "ocn-node"
version = "0.1.0"
edition = "2024"

[dependencies]
ocn-core = { path = "../ocn-core" }
ocn-compute = { path = "../ocn-compute" }
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
rcgen = "0.13"
ring = "0.17"
rustls = "0.23"
async-trait = "0.1"
quinn = "0.11"
