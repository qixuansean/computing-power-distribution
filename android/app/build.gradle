plugins {
    id 'com.android.application'
}

android {
    namespace 'org.opencompute.network'
    compileSdk 34

    defaultConfig {
        applicationId "org.opencompute.network"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
